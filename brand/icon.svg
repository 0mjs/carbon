<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon as a drawing. The PNG and the .icns are made by build.sh, which shades the tile without steps -->
  <defs>
    <!-- Deep black that lifts a little towards the top, as the icons beside it in a Dock do. No rim: the Dock draws its own -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#272727"/><stop offset="0.45" stop-color="#141414"/><stop offset="1" stop-color="#070707"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#shadow)"/>
  <g transform="translate(512 512) scale(1.2) translate(-256 -256)"><circle cx="256" cy="256" r="150" fill="none" stroke-width="68" stroke-dasharray="759.2 183.3" transform="rotate(35 256 256)" stroke="#f4f4f5"/><circle cx="408" cy="256" r="38" fill="#f4f4f5"/></g>
</svg>

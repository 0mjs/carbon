# Carbon's own tools and commands.
# Rust itself comes from rustup, at the version in rust-toolchain.toml

[tasks.start]
description = "Run the hub in this terminal, without the app"
run = "cargo run --release -- serve"

[tasks.app]
description = "Build Carbon.app into dist/ and open it"
run = ["./desktop/bundle.sh", "open dist/Carbon.app"]

[tasks.install-app]
description = "Build Carbon.app and put it in /Applications (macOS)"
run = ["./desktop/bundle.sh", "osascript -e 'quit app \"Carbon\"' 2>/dev/null || true", "rm -rf /Applications/Carbon.app", "ditto dist/Carbon.app /Applications/Carbon.app", "echo Installed /Applications/Carbon.app"]

[tasks.install]
description = "Install the `carbon` command into ~/.cargo/bin"
run = "cargo install --path . --locked"

[tasks.check]
description = "Tests and format"
run = ["cargo test", "cargo fmt --check"]

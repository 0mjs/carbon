[package]
name = "carbon-desktop"
version = "0.0.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/0mjs/carbon"
description = "Carbon as a desktop app: the hub and its dashboard in a native window, drawn with Rune"

[[bin]]
# Not "Carbon": on a disk that ignores case that is the same file as the `carbon` command, built beside it
name = "carbon-desktop"
path = "src/main.rs"

[dependencies]
carbon = { path = ".." }
# Pre-release: pinned to one revision of its dev branch, the same one the workspace patches use
rune = { git = "https://github.com/anomalyco/rune", rev = "2c4cf4d91a1a696408a5dc2d4d4699a18fa25b91", features = ["tooling", "native-file-dialog"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

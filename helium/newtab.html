<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Carbon</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
        font:
          14px/1.6 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      p {
        margin: 0;
        opacity: 0.65;
      }
      code {
        font:
          12px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <!-- Only seen when Carbon isn't answering; otherwise the tab goes straight to the dashboard -->
    <main id="down" hidden>
      <h1>Carbon isn’t running</h1>
      <p>Start it, and new tabs will open the dashboard: <code>cd ~/dev/lab/carbon && bun run start</code></p>
    </main>
    <script src="newtab.js"></script>
  </body>
</html>

[workspace]
members = [".", "desktop"]
resolver = "3"

[package]
name = "carbon"
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/0mjs/carbon"
description = "A local hub for dev servers: always on port 3000, it finds your projects and starts, stops and shows every server"

[lib]
name = "carbon"
path = "src/lib.rs"

[[bin]]
name = "carbon"
path = "src/main.rs"

[dependencies]
axum = "0.8"
libc = "0.2"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "signal", "time", "fs"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Rune (the desktop app's UI) ships patched copies of these; an app that builds Rune patches them too, at the same
# revision as Rune itself (see desktop/Cargo.toml)
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "2c4cf4d91a1a696408a5dc2d4d4699a18fa25b91" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "2c4cf4d91a1a696408a5dc2d4d4699a18fa25b91" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "2c4cf4d91a1a696408a5dc2d4d4699a18fa25b91" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "2c4cf4d91a1a696408a5dc2d4d4699a18fa25b91" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "2c4cf4d91a1a696408a5dc2d4d4699a18fa25b91" }
